apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sp-avslagsdager-db-policy
  namespace: tbd
spec:
  egress:
    - to:
        - ipBlock:
            # TODO: Sett inn public IP-en til Cloud SQL-instansen sp-avslagsdager etter første deploy av hovedappen.
            # Slås opp med: kubectl get sqlinstance sp-avslagsdager -n tbd -o jsonpath='{.status.publicIpAddress}'
            cidr: 0.0.0.0/32
  podSelector:
    matchLabels:
      dbPolicyUser: sp-avslagsdager-opprydding-dev
  policyTypes:
    - Egress
